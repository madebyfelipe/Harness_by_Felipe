# Rotina da Central. Agenda em America/Sao_Paulo. Rotina roda sozinha e reporta depois.
nome: resumo-semana
titulo: Resumo da semana + triagem de feedback
quando: domingo às 20:00
cron: 0 20 * * 0
agente: orquestrador
modo: vps
ativa: true
silencio: false
whatsapp: true
limite_minutos: 30
liberadas:
  - Edit
  - Write
  - Bash
instrucoes: |
  Triagem semanal de feedback.md (formato e regras no próprio arquivo e em decisoes.md):
  1. Leia feedback.md, decisoes.md e milestones.md.
  2. Para cada registro com "→ (a encaminhar na triagem semanal)": decida se vira regra
     (escreva no arquivo certo e numa linha nova em decisoes.md, com a data de hoje),
     ideia/cartão de milestone (seção "Entrada (ideias)" de milestones.md), ajuste já feito,
     ou descartado (com o motivo). Troque a seta pelo encaminhamento escolhido.
     Repetido 2 ou mais vezes = prioridade.
  3. Não mude oferta, preço, regra de copy nem nada que seja decisão do Felipe: liste em
     "Precisa do Felipe".
  4. Faça commit só dos .md que mudou.
  Responda em até 5 linhas: o que virou regra, o que virou tarefa, o que precisa dele.
